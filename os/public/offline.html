<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sem conexão · Multmec OS</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #1d2328; color: #f4f7f9; padding: 16px; box-sizing: border-box; }
        .box { max-width: 360px; text-align: center; }
        h1 { font-size: 22px; margin: 16px 0 8px; }
        p { color: #a9b6c0; line-height: 1.5; }
        button { margin-top: 12px; background: #0874bd; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: 600; }
        img { width: 88px; height: 88px; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/images/logo.png" alt="">
        <h1>Sem conexão</h1>
        <p>O celular está sem internet agora. Nada do que você já salvou se perdeu. Assim que o sinal voltar, toque em tentar de novo.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
</body>
</html>
